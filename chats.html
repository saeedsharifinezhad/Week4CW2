<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="chats.css">
    <title>Chats</title>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Chats</h1>
        </header>

        <main>
            <ul class="chat-list">
                <li>
                    <button class="chat" type="button">
                        <img class="avatar" src="assets/james.png" alt="" width="64" height="64">
                        <span class="chat-content">
                            <span class="chat-name">James</span>
                            <span class="chat-message">Thank you! That was very helpful!</span>
                        </span>
                    </button>
                </li>
                <li>
                    <button class="chat" type="button">
                        <img class="avatar" src="assets/will-kenny.png" alt="" width="64" height="64">
                        <span class="chat-content">
                            <span class="chat-name">Will Kenny</span>
                            <span class="chat-message">I know... I’m trying to get the funds.</span>
                        </span>
                    </button>
                </li>
                <li>
                    <button class="chat" type="button">
                        <img class="avatar" src="assets/beth-williams.png" alt="" width="64" height="64">
                        <span class="chat-content">
                            <span class="chat-name">Beth Williams</span>
                            <span class="chat-message">I’m looking for tips around capturing the milky way. I have a 6D with a 24-100mm...</span>
                        </span>
                    </button>
                </li>
                <li>
                    <button class="chat" type="button">
                        <img class="avatar" src="assets/rev-shawn.png" alt="" width="64" height="64">
                        <span class="chat-content">
                            <span class="chat-name">Rev Shawn</span>
                            <span class="chat-message">Wanted to ask if you’re available for a portrait shoot next week.</span>
                        </span>
                    </button>
                </li>
            </ul>
        </main>

        <div class="bottom-space"></div>
    </div>
</body>
</html>
