<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <title>profile</title>
</head>

<body>
    <main>
        <div class="profile-page">
            <div class="hero">
                <div class="avatar">
                    <img src="profile-images/avatar.png" alt="" class="avatar">
                </div>


                <p class="name">Jane</p>
                <p class="bio">SAN FRANCISCO, CA</p>


                <div class="follow">
                    <button class="follow-button">FOLLOW JANE</button>
                </div>

                <div class="message">
                    <button class="message-button">MESSAGE</button>
                </div>

            </div>
        </div>

        <div class="gallery">
            <div class="left-column">
            <img src="profile-images/Rectangle 2.png" alt="">
            <img src="profile-images/Rectangle 2.2.png" alt="">
            <img src="profile-images/Rectangle 2.4.png" alt="">

            </div>

            <div class="right-column">
            <img src="profile-images/Rectangle 2.1.png" alt="">
            <img src="profile-images/Rectangle 2.3.png" alt="">
            <img src="profile-images/Rectangle 2.5.png" alt="">
            </div>
        </div>

        <div>
            <button class="seeMore-button">SEE MORE</button>
        </div>
    </main>
</body>

</html>
