<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="navigation.css">
    <title>James — Chat</title>
</head>
<body>
    <div class="app">
        <header class="header">
            <a class="back-link" href="chats.html">
                <img src="assets/back.svg" alt="">
            </a>
            <h1>James</h1>
        </header>

        <main>
            <ol class="messages">
                <li class="message message-incoming">
                    <img class="avatar" src="assets/chat-james.png" alt="" width="28" height="28">
                    <p class="message-bubble">Really love your most recent photo. I’ve been trying to capture the same thing for a few months and would love some tips!</p>
                </li>
                <li class="message message-outgoing">
                    <img class="avatar" src="assets/chat-you.png" alt="" width="28" height="28">
                    <p class="message-bubble">A fast 50mm like f1.8 would help with the bokeh. I’ve been using primes as they tend to get a bit sharper images.</p>
                </li>
                <li class="message message-incoming">
                    <img class="avatar" src="assets/chat-james.png" alt="" width="28" height="28">
                    <p class="message-bubble">Thank you! That was very helpful!</p>
                </li>
            </ol>
        </main>

        <div class="bottom-space"></div>
    </div>
    <footer>
        <div class="bottom-navbar">
            <img src="images/footer-navbar/new.svg" alt="">
            <img src="images/footer-navbar/search.svg" alt="">
            <span class="middle-button">
                <img class="icon-middle" src="images/footer-navbar/Union.svg" alt="">
            </span>
            <img src="images/footer-navbar/Comment.svg" alt="">
            <img src="images/footer-navbar/bell.svg" alt="">
        </div>
        <div class="bottom-line">
            <img src="images/footer-navbar/Shape.svg" alt="">
        </div>
    </footer>
</body>
</html>
